version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Packages that move together land in one pull request.
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      three:
        patterns: ["three", "@types/three", "@react-three/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
