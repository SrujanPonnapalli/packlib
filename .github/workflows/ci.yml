name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# cancel the old run if something new gets pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the collector's Lambda runtime
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit # typegen generates PageProps/LayoutProps, which a fresh checkout doesn't have
      - run: npm test
      - run: npm run build
